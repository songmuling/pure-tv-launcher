name: Build Pure TV Launcher APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build All Flavors APK
        run: |
          ./gradlew assembleRelease --stacktrace || {
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-failure-log
            ./gradlew assembleRelease --stacktrace > gradle-error.log 2>&1 || true
            git add -f gradle-error.log
            git commit -m "ci: capture gradle failure log [skip ci]"
            git push -f origin build-failure-log
            exit 1
          }

      - name: Upload Skyworth APK (创维专版)
        uses: actions/upload-artifact@v4
        with:
          name: PureTV-Skyworth-Release-APK
          path: app/build/outputs/apk/skyworth/release/*.apk
          retention-days: 14

      - name: Upload Universal APK (通用标准版)
        uses: actions/upload-artifact@v4
        with:
          name: PureTV-Universal-Release-APK
          path: app/build/outputs/apk/universal/release/*.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Pure TV Launcher v1.0.${{ github.run_number }}"
          make_latest: true
          generate_release_notes: true
          body: |
            ### 📺 Pure TV Launcher 极简纯净电视桌面 (Release 正式版)
            
            专为智能电视与电视盒子打造的轻量纯净桌面，去广告、开机秒启、极简流畅。
            
            #### 📦 安装包下载指南（请根据您的设备选择）：
            - 🔹 **通用标准版 (`PureTV-Universal-release.apk`)**：
              - 适合设备：小米、索尼、海信、TCL、长虹、飞利浦及外贸 Google TV 电视/盒子等 99% 的设备。
              - 核心优化：完美兼容 Android 5.0 ~ 14+（老款小米电视 4A 等绝不闪退）；动态直通小米电视原生设置；正式版混淆与资源瘦身，体积仅 ~2MB，冷启动极速秒开。
            - 🔹 **创维专版 (`PureTV-Skyworth-release.apk`)**：
              - 适合设备：创维小湃盒子（P3 Pro 等）、创维电视。
              - 核心优化：伪装企鹅极光出厂白名单 `com.ktcp.launcher`，突破系统防替换保护；开机秒启（`directBootAware`）；设置键直达创维原生设置。
            
            #### ✨ 核心功能与升级：
            1. **Apple TV 纯正极简 Dock 桌面**：主界面仅保留 6 个常用应用黄金席位，单行排布绝对等宽等高，空槽位显示精美 `+` 号。
            2. **毛玻璃「全部应用」抽屉**：Dock 正下方一键展开全屏 6 列应用中心，按返回键丝滑收起，点击任意应用秒启。
            3. **智能 Dock 槽位分配与自动移位**：点击 `+` 号或长按已有磁贴直接弹出应用列表；从 `+` 号选择已有应用时原位置自动变 `+`，两已有应用对选时自动智能互换位置。
            4. **微软官方 4K 天气摄影壁纸**：依据本地实时天气与昼夜晨昏自动换装微软官方 4K 超清大片摄影壁纸。
            5. **天气城市手动指定 / 防 IP 漂移**：支持全国重点城市遥控器一键切换，翻墙软路由环境不漂移。
            6. **必应每日 4K 超清壁纸**与**默认极简流光主题**自由切换。
          files: |
            app/build/outputs/apk/skyworth/release/*.apk
            app/build/outputs/apk/universal/release/*.apk


