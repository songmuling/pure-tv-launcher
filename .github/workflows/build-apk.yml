name: Build Pure TV Launcher APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build All Flavors APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Skyworth APK (创维专版)
        uses: actions/upload-artifact@v4
        with:
          name: PureTV-Skyworth-APK
          path: app/build/outputs/apk/skyworth/debug/*.apk
          retention-days: 14

      - name: Upload Xiaomi APK (小米专版)
        uses: actions/upload-artifact@v4
        with:
          name: PureTV-Xiaomi-APK
          path: app/build/outputs/apk/xiaomi/debug/*.apk
          retention-days: 14

      - name: Upload Universal APK (通用版)
        uses: actions/upload-artifact@v4
        with:
          name: PureTV-Universal-APK
          path: app/build/outputs/apk/universal/debug/*.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Pure TV Launcher v1.0.${{ github.run_number }}"
          make_latest: true
          generate_release_notes: true
          body: |
            ### 📺 Pure TV Launcher 极简纯净电视桌面
            
            专为智能电视与电视盒子打造的轻量纯净桌面，去广告、开机秒启、极简流畅。
            
            #### 📦 安装包下载指南（请根据您的设备选择）：
            - 🔹 **创维专版 (`PureTV-Skyworth-debug.apk`)**：
              - 适合设备：创维小湃盒子（P3 Pro 等）、创维电视
              - 核心优化：伪装企鹅极光出厂白名单 `com.ktcp.launcher`，突破系统防替换保护；开机秒启（`directBootAware`）；设置键直达创维原生设置。
            - 🔹 **小米专版 (`PureTV-Xiaomi-debug.apk`)**：
              - 适合设备：小米电视 4A 及全系列小米电视/盒子
              - 核心优化：全面兼容 Android 6.0 (API 21+)，杜绝老电视闪退；设置键直达 MIUI TV 专有设置。
            - 🔹 **通用标准版 (`PureTV-Universal-debug.apk`)**：
              - 适合设备：索尼、海信、TCL 或外贸 Google TV 电视/盒子。
            
            #### ✨ 本次核心功能与升级：
            1. **动态天气 4K 高清壁纸 (Bing 官方云端池)**：依据实时天气与昼夜晨昏自动换装微软官方 4K 摄影壁纸，无需大包体积（安装包仅 ~2MB），真 4K 细腻震撼。
            2. **城市手动指定 / 防翻墙 IP 漂移**：支持全国 30+ 重点城市遥控器一键选择，即使家庭网络开启软路由 VPN / 代理，也不会错误定位到国外。
            3. **必应每日壁纸 4K UHD 升级**：默认下载官方最高规格 4K 原图（_UHD.jpg），4K 大电视绝对清晰细腻。
            4. **默认极简主题**：第三种壁纸模式更名为默认极简主题，保留纯正原生渐变质感。
            5. **长按图标原地快捷菜单**：移动排序 / 置顶到首行程序坞 / 从桌面隐藏。
            6. **已隐藏应用库**：被隐藏的系统或内置应用可在隐藏应用中心随时找回。
          files: |
            app/build/outputs/apk/skyworth/debug/*.apk
            app/build/outputs/apk/xiaomi/debug/*.apk
            app/build/outputs/apk/universal/debug/*.apk


