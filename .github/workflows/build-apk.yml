name: Build Pure TV Launcher APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build All Flavors APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Skyworth APK (创维专版)
        uses: actions/upload-artifact@v4
        with:
          name: PureTV-Skyworth-APK
          path: app/build/outputs/apk/skyworth/debug/*.apk
          retention-days: 14

      - name: Upload Xiaomi APK (小米专版)
        uses: actions/upload-artifact@v4
        with:
          name: PureTV-Xiaomi-APK
          path: app/build/outputs/apk/xiaomi/debug/*.apk
          retention-days: 14

      - name: Upload Universal APK (通用版)
        uses: actions/upload-artifact@v4
        with:
          name: PureTV-Universal-APK
          path: app/build/outputs/apk/universal/debug/*.apk
          retention-days: 14

