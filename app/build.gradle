plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode 6
        versionName '2.5'
    }

    flavorDimensions = ["device"]
    productFlavors {
        skyworth {
            dimension "device"
            applicationId 'com.ktcp.launcher'
            versionNameSuffix "-skyworth"
        }
        universal {
            dimension "device"
            applicationId 'com.gathin.tvhome'
            versionNameSuffix "-universal"
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "PureTV-${variant.flavorName.capitalize()}-${variant.buildType.name}.apk"
        }
    }

    signingConfigs {
        release {
            storeFile file("puretv-release.jks")
            storePassword "puretv123"
            keyAlias "puretv"
            keyPassword "puretv123"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    testImplementation 'junit:junit:4.13.2'
}
